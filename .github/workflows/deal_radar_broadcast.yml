name: Radar Prezzi & Canale Telegram 24/7 (100% Gratis)

on:
  schedule:
    # Esegue automaticamente ogni 30 minuti, 24 ore su 24, 7 giorni su 7
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permette anche l'avvio manuale con 1 click dalla dashboard di GitHub

jobs:
  run-radar-and-broadcast:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permesso per salvare lo storico e il log delle offerte inviate

    steps:
      - name: 📥 Scarica Codice Repository
        uses: actions/checkout@v4

      - name: 🐍 Configura Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 📦 Installa Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📡 Scansione Radar Cali di Prezzo Amazon
        run: |
          python core/live_deal_monitor.py --once

      - name: 📢 Pubblicazione Automatica Migliore Offerta sul Canale Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '-1003838698998' }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG || 'offertissimes-21' }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "🚀 Invio offerta verificata sul canale Telegram..."
            python bot/telegram_channel_broadcaster.py --once
          else
            echo "⚠️ Secret TELEGRAM_BOT_TOKEN non ancora impostato nei Settings di GitHub. Esecuzione dry-run di verifica:"
            python bot/telegram_channel_broadcaster.py --dry-run
          fi

      - name: 💾 Salva Registro Post e Storico Database su Git
        run: |
          git config --global user.name "OffertissimeSconti Radar Bot"
          git config --global user.email "bot@offertissimesconti.it"
          git add data/amazon_3000_master_catalog.db
          if git diff --staged --quiet; then
            echo "Nessuna variazione da committare."
          else
            git commit -m "chore(radar): aggiornamento automatico prezzi e log broadcast [skip ci]"
            git push origin master
          fi
